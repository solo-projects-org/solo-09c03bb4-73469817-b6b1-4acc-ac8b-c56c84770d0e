services:
  radar-api:
    build: .
    image: radar-merge-api:latest
    container_name: radar-merge-api
    ports:
      - "8000:8000"
    environment:
      RADAR_DB_PATH: /data/radar.db
      RADAR_GRID_SIZE: "32"
    volumes:
      - radar-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  radar-data:
